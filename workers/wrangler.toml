name = "blindlist"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (public, non-sensitive)
[vars]
NODE_ENV = "production"
# Your Amazon Associates tag (US), e.g. "yourname-20". Leave empty to turn affiliate tagging off.
AMAZON_TAG_US = "jaquibis-20"

# Secrets (set these with: wrangler secret put SECRET_NAME)
# - DATABASE_URL (your Supabase connection string)
# - RESEND_API_KEY
# - FRONTEND_URL

# Cron trigger to keep Supabase database alive.
# Fires hourly; the handler pings the DB only during 1-2 pseudo-random hours per day.
# Supabase pauses free projects after ~7 days of inactivity.
[triggers]
crons = ["0 * * * *"]

# CORS settings
[env.production]
name = "blindlist"

[build]
command = "npx prisma generate"

[observability.logs]
enabled = true
invocation_logs = true
